name: Feature request
description: Suggest an addition or a change to the API
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not just the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      render: tsx

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: cally
    attributes:
      label: Parity
      options:
        - label: This exists in [Cally](https://github.com/WickyNilliams/cally) and is missing here
